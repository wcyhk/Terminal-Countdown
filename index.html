<!doctype html><html lang="zh-Hant-HK"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10192f"><title>終極倒數｜Terminal Countdown</title><meta name="description" content="日系動漫任務風格的課堂與活動倒數計時器。支援暫停、扣時、三種主題及音效。"><link rel="stylesheet" href="style.css"></head><body data-theme="tnt">
<header><a class="brand" href="https://wcy.hk">WCY.HK <span>/ INTERACTIVE WORLDS</span></a><div class="header-tools"><button id="sound" aria-pressed="false">音效 關</button><button id="fullscreen">全螢幕 ↗</button></div></header>
<main><section class="art-panel"><div class="chapter">TIME OPERATIONS <span>01 / 03</span></div><div class="art-copy"><p class="eyebrow">終極倒數 · 任務計時</p><h1>每一秒，<br>都是關鍵。</h1><p>為課堂挑戰、團隊任務與限時活動，<br>留一個全力以赴的舞台。</p></div><span class="art-footer">THE NEXT MOMENT IS YOURS.</span></section>
<section class="console" aria-label="倒數控制台"><div class="console-heading"><span class="eyebrow" id="theme-title">TNT / 能量核心</span><span class="signal">● SYSTEM READY</span></div><p id="phase" class="phase" role="status">準備開始任務</p><div id="clock" class="clock" role="timer" aria-label="剩餘時間">05:00</div><div class="meter"><div id="progress"></div></div><div class="time-meta"><span>REMAINING TIME</span><span id="duration-label">任務時限 5 分鐘</span></div>
<div class="primary-actions"><button id="toggle" class="primary">開始任務 ▶</button><button id="subtract" class="secondary">扣除 30 秒</button></div><div class="settings"><div class="section-title"><span>01 / 任務時限</span><button id="reset" class="text-button">↺ 重設計時</button></div><div class="presets"><button data-minutes="1">1 分鐘</button><button data-minutes="3">3 分鐘</button><button data-minutes="5">5 分鐘</button><button data-minutes="10">10 分鐘</button></div><form id="duration-form"><label for="minutes">自訂分鐘</label><input id="minutes" type="number" min="0.05" max="180" step="0.01" value="5" required><button type="submit">套用</button></form><p id="error" role="alert"></p></div><div class="settings"><div class="section-title">02 / 視覺主題</div><div class="themes" role="group" aria-label="選擇主題"><button data-theme="tnt" aria-pressed="true"><span>01</span>能量核心</button><button data-theme="bio" aria-pressed="false"><span>02</span>生態警報</button><button data-theme="nuclear" aria-pressed="false"><span>03</span>星核倒數</button></div></div><p class="hint">暫停後可繼續；重設會返回目前設定時限。重新整理頁面會開始新任務。</p></section></main>
<footer><span>TERMINAL COUNTDOWN / WCY.HK</span><a href="https://github.com/wcyhk/Terminal-Countdown" target="_blank" rel="noopener noreferrer">GitHub 程式碼 ↗</a></footer><div id="end-flash" aria-hidden="true"></div><script type="module" src="app.mjs"></script></body></html>
